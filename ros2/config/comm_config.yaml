# ROS2 communication configuration

# First active channel in this list is used for /controller/joy.
priority:
  - wifi
  - bluetooth

# A channel is ignored when no ControllerData packet arrives within this window.
stale_timeout_ms: 200

# Lower this on weak receiver machines. 50 Hz is enough for most controller debug.
poll_rate_hz: 50

# Avoid publishing the same ControllerData repeatedly when no new packet arrived.
publish_on_new_data_only: true

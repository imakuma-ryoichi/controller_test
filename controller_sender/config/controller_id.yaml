# Linux Joystick API event number for each ControllerData entry.
axis:
  left_stick_x: 0
  left_stick_y: 1
  l2: 2
  right_stick_x: 3
  right_stick_y: 4
  r2: 5
  dpad_left_right: 6
  dpad_up_down: 7

button:
  cross: 0
  circle: 1
  triangle: 2
  square: 3
  l1: 4
  r1: 5
  l2: 6
  r2: 7
  create: 8
  option: 9
  ps: 10
  left_stick: 11
  right_stick: 12
